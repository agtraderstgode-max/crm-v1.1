<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AG TRADERS - Letterhead Editor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 60px 0;
      min-height: 100vh;
    }

    /* Top Floating Toolbar */
    .toolbar {
      position: sticky;
      top: 15px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      padding: 10px 22px;
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
      border: 1px solid #e2e8f0;
    }

    .toolbar-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #0F2942;
      margin-right: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      appearance: none;
      border: none;
      background: #f1f5f9;
      color: #334155;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #0284C7;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #0369a1;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
    }

    .btn-danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .btn-danger:hover {
      background: #fecaca;
    }

    .status-text {
      font-size: 12px;
      color: #10b981;
      font-weight: 600;
      margin-left: 6px;
    }

    /* A4 Paper Sheet */
    .page {
      width: 210mm;
      min-height: 297mm;
      height: 297mm;
      background: #ffffff;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      position: relative;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 14mm 18mm 12mm 18mm;
      overflow: hidden;
    }

      z-index: 1;
    }

    /* Header */
    .header {
      position: relative;
      z-index: 2;
      width: 100%;
      margin-bottom: 3mm;
    }

    .header-banner {
      width: 100%;
      display: block;
    }

    /* Meta Bar: Ref No & Date */
    .meta-bar {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #0F2942;
      padding: 2mm 0 4mm 0;
    }

    .meta-field {
      outline: none;
      display: inline-block;
      min-width: 130px;
      border-bottom: 1px dashed #cbd5e1;
      padding: 2px 6px;
      font-weight: normal;
      color: #1e293b;
      transition: background-color 0.2s;
    }

    .meta-field:focus {
      border-bottom-color: #0284C7;
      background-color: #f0f9ff;
    }

    /* Main Editable Body */
    .body-content {
      position: relative;
      z-index: 2;
      flex: 1;
      outline: none;
      font-size: 13.5px;
      line-height: 1.6;
      color: #1e293b;
      padding: 2mm 2px;
      overflow-y: auto;
    }

    .body-content:focus {
      outline: none;
    }

    .body-content:empty:before {
      content: attr(data-placeholder);
      color: #94a3b8;
      font-style: italic;
      pointer-events: none;
    }

    /* Footer */
    .footer {
      position: relative;
      z-index: 2;
      width: 100%;
      margin-top: auto;
    }

    .footer-banner {
      width: 100%;
      display: block;
    }

    /* Sample Table inside body */
    .quote-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 12px;
    }

    .quote-table th {
      background: #0F2942;
      color: #ffffff;
      padding: 7px 10px;
      text-align: left;
      font-weight: 600;
    }

    .quote-table td {
      padding: 6px 10px;
      border: 1px solid #e2e8f0;
    }

    .quote-table tr:nth-child(even) {
      background: #f8fafc;
    }

    /* PRINT RULES FOR CHROME / SAFARI / EDGE */
    @media print {
      body {
        background: none !important;
        padding: 0 !important;
        display: block !important;
      }

      .toolbar {
        display: none !important;
      }

      .page {
        width: 100% !important;
        height: 100vh !important;
        min-height: 100vh !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 12mm 16mm 10mm 16mm !important;
        page-break-after: avoid;
        page-break-inside: avoid;
      }

      .meta-field {
        border-bottom: none !important;
      }

      @page {
        size: A4 portrait;
        margin: 0;
      }
    }
  </style>
</head>

  <script>
    const editor = document.getElementById('editor');
    const refNo = document.getElementById('refNo');
    const letterDate = document.getElementById('letterDate');
    const saveStatus = document.getElementById('saveStatus');

    function getTodayFormatted() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      return `${day} / ${month} / ${year}`;
    }

    function insertDate() {
      letterDate.innerText = getTodayFormatted();
      triggerSave();
    }

    if (!letterDate.innerText.trim()) {
      letterDate.innerText = getTodayFormatted();
    }

    function triggerSave() {
      localStorage.setItem('ag_traders_content', editor.innerHTML);
      localStorage.setItem('ag_traders_ref', refNo.innerText);
      localStorage.setItem('ag_traders_date', letterDate.innerText);
      saveStatus.innerText = '✓ Auto-saved';
      saveStatus.style.color = '#10b981';
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedContent = localStorage.getItem('ag_traders_content');
      const savedRef = localStorage.getItem('ag_traders_ref');
      const savedDate = localStorage.getItem('ag_traders_date');

      if (savedContent) {
        editor.innerHTML = savedContent;
      }
      if (savedRef) {
        refNo.innerText = savedRef;
      }
      if (savedDate) {
        letterDate.innerText = savedDate;
      }
    });

    editor.addEventListener('input', () => {
      saveStatus.innerText = 'Saving...';
      saveStatus.style.color = '#f59e0b';
      clearTimeout(window.saveTimer);
      window.saveTimer = setTimeout(triggerSave, 400);
    });

    refNo.addEventListener('input', triggerSave);
    letterDate.addEventListener('input', triggerSave);

    function clearContent() {
      if (confirm("Are you sure you want to clear the sheet?")) {
        editor.innerHTML = "";
        triggerSave();
